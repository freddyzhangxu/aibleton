<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIbleton</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    * { margin: 0; }
    input, button, textarea { font: inherit; }

    :root {
      --c-bg: hsl(0, 0%, 21%);
      --c-panel: hsl(0, 0%, 16%);
      --c-input-bg: hsl(0, 0%, 12%);
      --c-text: hsl(0, 0%, 78%);
      --c-text-dim: hsl(0, 0%, 45%);
      --c-border: hsl(0, 0%, 7%);
      --c-accent: hsl(31, 100%, 67%);
    }

    html, body { height: 100%; }
    body {
      background: var(--c-bg);
      color: var(--c-text);
      font-family: "AbletonSansSmall", "PingFang SC", sans-serif;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 8px 12px;
      background: var(--c-panel);
      border-bottom: 1px solid var(--c-border);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    header .row { display: flex; gap: 6px; align-items: center; }
    header .title { font-weight: 700; color: var(--c-accent); margin-right: auto; display: flex; align-items: center; gap: 6px; }
    header .title .logo { height: 13px; width: auto; display: block; }

    /* Inside AIbletonBar (native window): the first header row sits beside
       macOS's real traffic-light buttons. Measured on macOS 26: lights end
       at x=46, center 16px from the top — so a 32px-tall header band puts
       them dead center. header's own 12px left padding + 43px here puts the
       title at x=55, i.e. a 9px gap after the yellow button (same as the
       red→yellow gap). */
    body.native-bar header { padding-top: 4px; padding-bottom: 4px; }
    body.native-bar header .row:first-child { padding-left: 43px; }

    /* macOS traffic lights */
    .lights { display: flex; gap: 8px; padding: 0 2px; }
    .light {
      width: 12px; height: 12px; border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.25);
      cursor: pointer; padding: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; line-height: 1; color: rgba(0,0,0,0.55);
    }
    .light span { opacity: 0; transition: opacity 0.1s; pointer-events: none; }
    .lights:hover .light:not(.disabled) span { opacity: 1; }
    .light.close { background: #FF5F57; }
    .light.close:active { background: #d94b44; }
    .light.min { background: #FEBC2E; }
    .light.min:active { background: #d89e24; }
    .light.max { background: #28C840; }
    .light.disabled {
      background: hsl(0, 0%, 30%);
      cursor: not-allowed;
    }

    .hdr-btn {
      background: none;
      border: none;
      color: var(--c-text-dim);
      cursor: pointer;
      font-size: 13px;
      width: 26px; height: 24px;
      display: flex; align-items: center; justify-content: center;
      padding: 0;
      border-radius: 5px;
      transition: color 0.15s ease, background-color 0.15s ease;
    }
    .hdr-btn:hover {
      color: var(--c-accent);
      background: var(--c-input-bg);
    }
    .hdr-btn:active { transform: scale(0.92); }
    .hdr-group { display: flex; gap: 1px; align-items: center; }
    .hdr-group .hdr-btn { width: 22px; }

    /* History dropdown */
    header { position: relative; }
    #historyPanel {
      position: absolute;
      top: 100%; right: 8px;
      width: 260px;
      max-height: 320px;
      overflow-y: auto;
      background: var(--c-panel);
      border: 1px solid var(--c-border);
      border-radius: 6px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.5);
      z-index: 10;
      padding: 4px;
    }
    #historyPanel.hidden { display: none; }
    .session-row {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .session-row:hover { background: var(--c-input-bg); }
    .session-row.current { outline: 1px solid var(--c-text-dim); }
    .session-row .meta { flex: 1; min-width: 0; }
    .session-row .name {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: var(--c-text);
    }
    .session-row .time { font-size: 10px; color: var(--c-text-dim); }
    .session-row .del {
      background: none; border: none; color: var(--c-text-dim);
      cursor: pointer; font-size: 12px; padding: 2px 4px;
      visibility: hidden;
    }
    .session-row:hover .del { visibility: visible; }
    .session-row .del:hover { color: #FF5F57; }
    #historyPanel .empty { padding: 12px; text-align: center; color: var(--c-text-dim); }
    header input {
      flex: 1;
      min-width: 0;
      background: var(--c-input-bg);
      color: var(--c-text);
      border: 1px solid var(--c-border);
      height: 22px;
      padding: 0 6px;
    }
    header input::placeholder { color: var(--c-text-dim); }

    /* Settings dropdown (gear button) — two-level menu */
    #settingsPanel {
      position: absolute;
      top: 100%; right: 8px;
      width: 252px;
      max-height: 70vh;
      overflow-y: auto;
      background: var(--c-panel);
      border: 1px solid var(--c-border);
      border-radius: 6px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.5);
      z-index: 10;
      padding: 4px;
    }
    #settingsPanel.hidden, .set-view.hidden { display: none; }
    .menu-row {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 8px;
      border-radius: 4px;
      cursor: pointer;
      user-select: none;
    }
    .menu-row:hover { background: var(--c-input-bg); }
    .menu-row .val { margin-left: auto; color: var(--c-text-dim); font-size: 11px; }
    .menu-row .tick { width: 14px; flex: none; color: var(--c-accent); font-size: 11px; }
    .menu-row.back { color: var(--c-text-dim); font-weight: 700; }
    .menu-row.back:hover { color: var(--c-text); }
    .menu-row.back .chev { width: 14px; flex: none; }
    .cfg-fields {
      border-top: 1px solid var(--c-border);
      margin-top: 2px;
      padding: 8px 8px 6px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .cfg-fields label { display: flex; flex-direction: column; gap: 3px; font-size: 10px; color: var(--c-text-dim); }
    .cfg-fields input {
      width: 100%;
      background: var(--c-input-bg);
      color: var(--c-text);
      border: 1px solid var(--c-border);
      border-radius: 3px;
      height: 22px;
      padding: 0 6px;
    }
    .cfg-fields input::placeholder { color: var(--c-text-dim); }
    .cfg-hint { font-size: 10px; color: var(--c-text-dim); line-height: 1.45; }

    #log {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      max-width: 92%;
      padding: 6px 10px;
      border-radius: 8px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--c-accent);
      color: hsl(0, 0%, 10%);
    }
    /* AI replies stretch full width so wrapped lines end at the same right
       edge as the (right-aligned) user bubbles — the wrap columns line up. */
    .msg.ai { align-self: stretch; max-width: none; background: var(--c-panel); border: 1px solid var(--c-border); }
    .msg.error { align-self: stretch; background: hsl(0, 60%, 25%); color: #fff; }
    .msg.thinking { align-self: flex-start; color: var(--c-text-dim); font-style: italic; }
    .action {
      align-self: flex-start;
      font-size: 11px;
      color: var(--c-text-dim);
      background: var(--c-input-bg);
      border: 1px solid var(--c-border);
      border-radius: 6px;
      padding: 3px 8px;
      font-family: ui-monospace, monospace;
      max-width: 92%;
      overflow-x: auto;
      white-space: nowrap;
    }

    footer {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px 12px;
      background: var(--c-panel);
      border-top: 1px solid var(--c-border);
    }
    footer .input-row { display: flex; gap: 6px; align-items: flex-end; }

    /* Attachment chips above the input */
    #chips { display: flex; flex-wrap: wrap; gap: 4px; }
    #chips:empty { display: none; }
    .chip {
      display: flex; align-items: center; gap: 4px;
      background: var(--c-input-bg);
      border: 1px solid var(--c-border);
      border-radius: 10px;
      padding: 2px 6px;
      font-size: 10px;
      color: var(--c-text);
      max-width: 160px;
    }
    .chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chip .x {
      background: none; border: none; color: var(--c-text-dim);
      cursor: pointer; padding: 0 2px; font-size: 11px; flex: none;
    }
    .chip .x:hover { color: #FF5F57; }

    /* Toolbar under the input: model / effort / attach … YOLO */
    .bar { display: flex; gap: 6px; align-items: center; }
    .bar-btn {
      background: var(--c-input-bg);
      border: 1px solid var(--c-border);
      border-radius: 10px;
      color: var(--c-text-dim);
      font-size: 10px;
      height: 20px;
      padding: 0 8px;
      cursor: pointer;
      display: flex; align-items: center; gap: 4px;
      max-width: 150px;
    }
    .bar-btn:hover { color: var(--c-accent); }
    .bar-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    select.bar-btn {
      appearance: none;
      -webkit-appearance: none;
      padding-right: 14px;
      background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
      background-position: calc(100% - 9px) 55%, calc(100% - 5px) 55%;
      background-size: 4px 4px;
      background-repeat: no-repeat;
    }
    select.bar-btn option { background: var(--c-panel); color: var(--c-text); }
    .bar .spacer { flex: 1; }

    /* YOLO toggle switch */
    .yolo { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--c-text-dim); cursor: pointer; user-select: none; }
    .yolo input { display: none; }
    .yolo .sw {
      width: 26px; height: 14px; border-radius: 7px;
      background: var(--c-input-bg);
      border: 1px solid var(--c-border);
      position: relative;
      transition: background 0.15s;
      flex: none;
    }
    .yolo .sw::after {
      content: '';
      position: absolute; top: 1px; left: 1px;
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--c-text-dim);
      transition: transform 0.15s, background 0.15s;
    }
    .yolo input:checked + .sw { background: hsl(31, 80%, 35%); border-color: hsl(31, 80%, 35%); }
    .yolo input:checked + .sw::after { transform: translateX(12px); background: var(--c-accent); }
    .yolo.on { color: var(--c-accent); }

    /* Permission ask bar (YOLO off) pinned above the input */
    #confirmBar {
      display: flex; align-items: center; gap: 6px;
      background: var(--c-input-bg);
      border: 1px solid var(--c-accent);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 11px;
    }
    #confirmBar.hidden { display: none; }
    #confirmBar .what { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, monospace; font-size: 10px; }
    #confirmBar button {
      border: none; border-radius: 4px; padding: 3px 10px;
      font-size: 11px; font-weight: 700; cursor: pointer; flex: none;
    }
    #confirmBar .allow { background: var(--c-accent); color: hsl(0, 0%, 10%); }
    #confirmBar .deny { background: none; color: var(--c-text-dim); border: 1px solid var(--c-border); }
    #confirmBar .deny:hover { color: #FF5F57; border-color: #FF5F57; }

    /* Dragging files over the window */
    body.dragging #log { outline: 2px dashed var(--c-accent); outline-offset: -4px; border-radius: 6px; }
    #input {
      flex: 1;
      background: var(--c-input-bg);
      color: var(--c-text);
      border: 1px solid var(--c-border);
      border-radius: 4px;
      padding: 6px 8px;
      resize: none;
      height: 54px;
      min-height: 54px;
      max-height: 134px; /* ~6 行，超出后内部滚动 */
      line-height: 20px;
      overflow-y: hidden;
    }
    #input:focus { outline: 2px solid var(--c-text-dim); }
    /* VSCode-style send: small square with an up arrow; while a task runs it
       becomes a stop button (same Ableton orange, filled-square icon). */
    #send {
      background: var(--c-accent);
      color: hsl(0, 0%, 10%);
      border: none;
      border-radius: 6px;
      width: 24px;
      height: 24px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex: none;
    }
    #send:hover { filter: brightness(1.08); }
    #send .ic-stop { display: none; }
    #send.stop .ic-send { display: none; }
    #send.stop .ic-stop { display: block; }
  </style>
</head>

<body>
  <header>
    <div class="row">
      <div class="lights">
        <button class="light close" id="btnClose" title="关闭"><span>×</span></button>
        <button class="light min" id="btnMin" title="最小化为右下角小条（需 AIbletonBar 运行中）"><span>–</span></button>
      </div>
      <span class="title"><svg class="logo" viewBox="42.666667 298.666667 938.666666 469.333333" xmlns="http://www.w3.org/2000/svg" aria-label="AIbleton"><defs><mask id="logoMaskA" maskUnits="userSpaceOnUse" x="42.666667" y="298.666667" width="426.666666" height="469.333333"><rect x="42.666667" y="298.666667" width="426.666666" height="469.333333" fill="#fff"/><path fill="#000" fill-rule="evenodd" d="M61.0 768.0 199.72117400419287 298.666667H308.73584905660374L450.99999999999994 768.0H358.61006289308176L327.2683438155136 659.01387032349H183.0964360587002L152.84486373165618 768.0ZM203.80922431865827 583.7315437550335H305.73794549266245L293.47379454926624 541.523042666443Q283.6624737945492 505.61431785973156 273.85115303983224 463.72080558523487Q264.03983228511527 421.82729331073824 253.41090146750523 373.9489935684564Q243.32704402515722 422.4572709389262 234.06079664570228 464.3507832134228Q224.79454926624737 506.2442954879195 215.52830188679243 541.523042666443Z M203.8092 583.7315 L305.7379 583.7315 L327.2683 659.0139 L183.0964 659.0139Z"/><path fill="#000" d="M241.4109 363.9490h24v21.0510h-24z"/></mask></defs><g mask="url(#logoMaskA)"><path fill="#797F7E" d="M42.666667 298.666667h426.666666v85.333333H42.666667z M42.666667 426.666667h426.666666v85.333333H42.666667z M42.666667 554.666667h426.666666v85.333333H42.666667z M42.666667 682.666667h426.666666v85.333333H42.666667z"/></g><path fill="#797F7E" d="M512 298.666667h85.333333v469.333333H512z M640 298.666667h85.333333v469.333333H640z M768 298.666667h85.333333v469.333333H768z M896 298.666667h85.333333v469.333333H896z"/></svg>AIbleton</span>
      <span id="status" style="color:var(--c-text-dim);font-size:11px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">…</span>
      <div class="hdr-group">
        <button id="newChat" class="hdr-btn" title="新建对话">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><path d="M12 8v6M9 11h6"/></svg>
        </button>
        <button id="showHistory" class="hdr-btn" title="历史对话">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>
        </button>
        <button id="showSettings" class="hdr-btn" title="设置">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </div>
    <div id="settingsPanel" class="hidden">
      <div class="set-view" id="viewMain">
        <div class="menu-row" data-goto="viewLang">
          <span data-i18n="language">语言</span>
          <span class="val"><span id="langVal">简体中文</span> ›</span>
        </div>
        <div class="menu-row" data-goto="viewAI">
          <span data-i18n="aiConfig">AI 配置</span>
          <span class="val"><span id="providerVal">Claude Code</span> ›</span>
        </div>
      </div>
      <div class="set-view hidden" id="viewLang">
        <div class="menu-row back" data-goto="viewMain"><span class="chev">‹</span><span data-i18n="language">语言</span></div>
        <div id="langList"></div>
      </div>
      <div class="set-view hidden" id="viewAI">
        <div class="menu-row back" data-goto="viewMain"><span class="chev">‹</span><span data-i18n="aiConfig">AI 配置</span></div>
        <div id="providerList"></div>
        <div class="cfg-fields">
          <label><span data-i18n="apiKey">API Key</span><input id="cfgKey" type="password" autocomplete="off"></label>
          <label><span data-i18n="baseUrl">API 地址</span><input id="cfgBase" autocomplete="off" spellcheck="false"></label>
          <label><span data-i18n="model">模型</span><input id="cfgModel" autocomplete="off" spellcheck="false"></label>
          <div class="cfg-hint" data-i18n="cfgHint">留空将自动使用本机 CLI 配置与默认值</div>
        </div>
      </div>
    </div>
    <div id="historyPanel" class="hidden"></div>
  </header>

  <div id="log">
    <div class="msg ai">你好！我是 Live 里的 AI 助手。
可以直接问我制作问题，也可以让我操作当前 Set，例如：
· 「把速度改成 128」
· 「新建一条 MIDI 轨道叫 Bass，加个 Operator」
· 「现在有哪些轨道？把第 2 条静音」</div>
  </div>

  <footer>
    <div id="chips"></div>
    <div id="confirmBar" class="hidden">
      <span>⚠️</span>
      <span class="what" id="confirmWhat"></span>
      <button class="allow" id="confirmAllow">允许</button>
      <button class="deny" id="confirmDeny">拒绝</button>
    </div>
    <div class="input-row">
      <textarea id="input" rows="2" placeholder="输入消息，Enter 发送（Shift+Enter 换行）"></textarea>
    </div>
    <div class="bar">
      <button id="modelBtn" class="bar-btn" title=""><span id="modelName">…</span></button>
      <select id="effortSel" class="bar-btn" title=""></select>
      <button id="attachBtn" class="bar-btn" title="">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <input type="file" id="fileInput" multiple hidden
        accept="image/png,image/jpeg,image/webp,image/gif,.txt,.md,.markdown,.json,.jsonc,.csv,.tsv,.xml,.log,.js,.ts,.py,.sh,.html,.css,.yml,.yaml,.ini,.mid,.midi,.als">
      <span class="spacer"></span>
      <label class="yolo" id="yoloLabel" title="">
        <span>YOLO</span>
        <input type="checkbox" id="yoloToggle" checked>
        <span class="sw"></span>
      </label>
      <button id="send" title="">
        <svg class="ic-send" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
        <svg class="ic-stop" width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
      </button>
    </div>
  </footer>

  <script>
    const log = document.getElementById('log');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const statusEl = document.getElementById('status');

    // ---------- i18n (language list matches Ableton Live's preferences) ----------
    const LANGS = [
      { code: 'en', name: 'English' },
      { code: 'zh', name: '简体中文' },
      { code: 'de', name: 'Deutsch' },
      { code: 'fr', name: 'Français' },
      { code: 'ja', name: '日本語' },
      { code: 'es', name: 'Español' },
      { code: 'it', name: 'Italiano' },

    let currentLang = localStorage.getItem('ai.lang') || 'en';
    if (!I18N[currentLang]) currentLang = 'en';
    const t = (k) => I18N[currentLang][k] ?? I18N.en[k] ?? k;

    // ---------- AI providers ----------
    const PROVIDERS = {
      claude: { name: 'Claude Code', base: 'https://api.anthropic.com', model: 'claude-sonnet-5' },
      codex:  { name: 'Codex',       base: 'https://api.openai.com/v1', model: 'gpt-5-codex' },
      gemini: { name: 'Gemini',      base: 'https://generativelanguage.googleapis.com', model: 'gemini-2.5-pro' },
    };
    let currentProvider = localStorage.getItem('ai.provider') || 'claude';
    if (!PROVIDERS[currentProvider]) currentProvider = 'claude';

    // Migrate pre-settings localStorage keys (they belonged to the Claude config).
    for (const f of ['apiKey', 'baseUrl', 'model']) {
      const old = localStorage.getItem('ai.' + f);
      if (old && !localStorage.getItem('ai.claude.' + f)) localStorage.setItem('ai.claude.' + f, old);
      localStorage.removeItem('ai.' + f);
    }

    const cfgInputs = {
      apiKey: document.getElementById('cfgKey'),
      baseUrl: document.getElementById('cfgBase'),
      model: document.getElementById('cfgModel'),
    };

    // Settings persist across dialog openings (same webview origin = same localStorage)
    function loadProviderFields() {
      for (const f of Object.keys(cfgInputs)) {
        cfgInputs[f].value = localStorage.getItem(`ai.${currentProvider}.${f}`) || '';
      }
      cfgInputs.apiKey.placeholder = t('apiKeyPh');
      cfgInputs.baseUrl.placeholder = PROVIDERS[currentProvider].base;
      cfgInputs.model.placeholder = PROVIDERS[currentProvider].model;
    }
    for (const f of Object.keys(cfgInputs)) {
      cfgInputs[f].addEventListener('change', () => {
        localStorage.setItem(`ai.${currentProvider}.${f}`, cfgInputs[f].value);
        refreshHealth();
      });
    }
    cfgInputs.model.addEventListener('input', () => updateModelName());

    // Toolbar model label: custom override > server-resolved > provider default.
    const modelName = document.getElementById('modelName');
    function updateModelName(serverModel) {
      modelName.textContent =
        cfgInputs.model.value || serverModel || PROVIDERS[currentProvider].model;
    }

    // Report which config the extension resolved for the selected provider.
    function refreshHealth() {
      fetch('/api/health?provider=' + currentProvider).then(r => r.json()).then(h => {
        updateModelName(h.model);
        const pName = PROVIDERS[currentProvider].name;
        if (h.hasAuth) {
          statusEl.textContent = t('cfgLoaded').replace('{p}', pName);
          statusEl.title = h.baseUrl || '';
          if (!cfgInputs.model.value && h.model) cfgInputs.model.placeholder = h.model;
        } else if (cfgInputs.apiKey.value) {
          statusEl.textContent = t('cfgKeySet').replace('{p}', pName);
          statusEl.title = '';
        } else {
          statusEl.textContent = t('cfgMissing').replace('{p}', pName);
          statusEl.title = '';
          settingsPanel.classList.remove('hidden');
          showView('viewAI');
        }
      }).catch(() => updateModelName());
    }

    // ---------- settings panel (gear → two-level menu) ----------
    const settingsPanel = document.getElementById('settingsPanel');
    const langVal = document.getElementById('langVal');
    const providerVal = document.getElementById('providerVal');

    function showView(id) {
      settingsPanel.querySelectorAll('.set-view').forEach(v => v.classList.toggle('hidden', v.id !== id));
    }
    settingsPanel.querySelectorAll('[data-goto]').forEach(el =>
      el.addEventListener('click', () => showView(el.dataset.goto)));

    const langList = document.getElementById('langList');
    function renderLangs() {
      langList.innerHTML = '';
      for (const l of LANGS) {
        const row = document.createElement('div');
        row.className = 'menu-row';
        const tick = document.createElement('span');
        tick.className = 'tick';
        tick.textContent = l.code === currentLang ? '✓' : '';
        const name = document.createElement('span');
        name.textContent = l.name;
        row.append(tick, name);
        row.addEventListener('click', (e) => {
          e.stopPropagation();
          if (l.code !== currentLang) {
            currentLang = l.code;
            localStorage.setItem('ai.lang', l.code);
            applyLang();
            renderLangs();
          }
          // Pick = done: close the panel like a native menu.
          settingsPanel.classList.add('hidden');
        });
        langList.appendChild(row);
      }
    }

    const providerList = document.getElementById('providerList');
    function renderProviders() {
      providerList.innerHTML = '';
      for (const [code, p] of Object.entries(PROVIDERS)) {
        const row = document.createElement('div');
        row.className = 'menu-row';
        const tick = document.createElement('span');
        tick.className = 'tick';
        tick.textContent = code === currentProvider ? '✓' : '';
        const name = document.createElement('span');
        name.textContent = p.name;
        row.append(tick, name);
        row.addEventListener('click', (e) => {
          e.stopPropagation();
          if (code !== currentProvider) {
            currentProvider = code;
            localStorage.setItem('ai.provider', code);
            loadProviderFields();
            renderEfforts();
            refreshHealth();
          }
          providerVal.textContent = p.name;
          renderProviders();
        });
        providerList.appendChild(row);
      }
    }

    document.getElementById('showSettings').addEventListener('click', (e) => {
      e.stopPropagation();
      const opening = settingsPanel.classList.contains('hidden');
      settingsPanel.classList.toggle('hidden');
      historyPanel.classList.add('hidden');
      if (opening) {
        // Re-render so the ✓ marks reflect the current state (they may have
        // changed in another window — see the storage listener below).
        renderLangs();
        renderProviders();
        showView('viewMain');
      }
    });

    // AIbletonBar and the in-Live dialog are separate webviews on the same
    // origin: a change made in one must refresh the other. The storage event
    // fires only in OTHER contexts, i.e. exactly the windows that didn't make
    // the change.
    window.addEventListener('storage', (e) => {
      if (e.key === 'ai.lang' && e.newValue && I18N[e.newValue] && e.newValue !== currentLang) {
        currentLang = e.newValue;
        applyLang();
        renderLangs();
      }
      if (e.key === 'ai.provider' && e.newValue && PROVIDERS[e.newValue] && e.newValue !== currentProvider) {
        currentProvider = e.newValue;
        providerVal.textContent = PROVIDERS[currentProvider].name;
        loadProviderFields();
        renderProviders();
        renderEfforts();
        refreshHealth();
      }
    });

    function applyLang() {
      document.documentElement.lang = LOCALES[currentLang];
      document.getElementById('btnClose').title = t('close');
      document.getElementById('btnMin').title = t('minimize');
      document.getElementById('newChat').title = t('newChat');
      document.getElementById('showHistory').title = t('history');
      document.getElementById('showSettings').title = t('settings');
      document.getElementById('modelBtn').title = t('modelTitle');
      document.getElementById('effortSel').title = t('effortTitle');
      document.getElementById('attachBtn').title = t('attachTitle');
      document.getElementById('yoloLabel').title = t('yoloTitle');
      document.getElementById('confirmAllow').textContent = t('allow');
      document.getElementById('confirmDeny').textContent = t('deny');
      sendBtn.title = sendBtn.classList.contains('stop') ? t('stop') : t('send');
      input.placeholder = t('inputPh');
      welcome.textContent = t('welcome');
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
      langVal.textContent = LANGS.find(l => l.code === currentLang).name;
      providerVal.textContent = PROVIDERS[currentProvider].name;
      loadProviderFields();
      renderEfforts();
      refreshHealth();
    }

    // Conversation history lives on the extension server (persisted to disk),
    // so it survives closing/reopening this window or using a browser instead.
    function addMsg(cls, text) {
      const div = document.createElement('div');
      div.className = 'msg ' + cls;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }

    function addAction(tool, input, result) {
      const div = document.createElement('div');
      div.className = 'action';
      div.textContent = '⚙ ' + tool + ' ' + JSON.stringify(input) + ' → ' + JSON.stringify(result);
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    // Traffic-light buttons: post close_and_send to the Live host to dismiss the dialog.
    // Works only inside Live's webview; in a regular browser the buttons just hide.
    function closeDialog() {
      const msg = { method: 'close_and_send', params: [JSON.stringify({ closed: true })] };
      if (window.webkit?.messageHandlers?.live) {
        window.webkit.messageHandlers.live.postMessage(msg);
      } else if (window.chrome?.webview) {
        window.chrome.webview.postMessage(msg);
      }
    }
    const inLive = !!(window.webkit?.messageHandlers?.live || window.chrome?.webview);
    if (!inLive) document.querySelector('.lights').style.display = 'none';
    // AIbletonBar (native macOS sidebar) identifies itself via its user agent;
    // its real traffic-light buttons overlay the header's top-left corner.
    if (navigator.userAgent.includes('AIbletonBar')) document.body.classList.add('native-bar');
    document.getElementById('btnClose').addEventListener('click', closeDialog);
    // Minimize: close the modal and hand off to AIbletonBar's mini bar at the
    // screen's bottom-right corner (queued via the extension server; the
    // companion app polls it). If AIbletonBar isn't running this just closes.
    document.getElementById('btnMin').addEventListener('click', async () => {
      try {
        await fetch('/api/panel', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ mode: 'bar' }),
        });
      } catch {}
      closeDialog();
    });

    // macOS window shortcuts: ⌘W close, ⌘M minimize (same as the traffic lights)
    document.addEventListener('keydown', (e) => {
      if (!inLive || !(e.metaKey || e.ctrlKey) || e.shiftKey || e.altKey) return;
      const key = e.key.toLowerCase();
      if (key === 'w' || key === 'm') {
        e.preventDefault();
        closeDialog();
      }
    });

    const welcome = log.querySelector('.msg.ai');

    function scrollToBottom() {
      log.scrollTop = log.scrollHeight;
      // The webview re-layouts after first paint (window sizing, fonts), which
      // can reset the scroll position — scroll again to land on the latest message.
      setTimeout(() => { log.scrollTop = log.scrollHeight; }, 60);
      setTimeout(() => { log.scrollTop = log.scrollHeight; }, 200);
    }

    function renderMessages(messages) {
      log.querySelectorAll('.msg, .action').forEach(el => el.remove());
      if (!messages || !messages.length) {
        log.appendChild(welcome);
        return;
      }
      messages.forEach(m => {
        if (m.role === 'assistant' && Array.isArray(m.actions)) {
          m.actions.forEach(a => addAction(a.tool, a.input, a.result));
        }
        addMsg(m.role === 'user' ? 'user' : 'ai', m.content);
      });
      scrollToBottom();
    }

    fetch('/api/history').then(r => r.json()).then(h => renderMessages(h.messages)).catch(() => {});

    // ----- background task tracking -----
    // Chat tasks run on the extension server, independent of this window's
    // lifetime: closing the dialog does not stop them. While a task runs we
    // poll /api/status; any (re)opened window picks the task up.
    let thinkingEl = null;

    // Busy = a task is running server-side: the send button becomes a stop
    // button (VSCode style); clicking it asks the server to abort the task.
    function setBusy(on) {
      sendBtn.classList.toggle('stop', on);
      sendBtn.title = on ? t('stop') : t('send');
    }

    function setThinking(on) {
      if (on && !thinkingEl) {
        thinkingEl = addMsg('thinking', t('thinking'));
      } else if (!on && thinkingEl) {
        thinkingEl.remove();
        thinkingEl = null;
      }
    }

    async function pollStatus() {
      const s = await fetch('/api/status').then(r => r.json()).catch(() => null);
      if (!s) return;
      if (s.busy) {
        setThinking(true);
        showConfirm(s.pending || null);
        setTimeout(pollStatus, 900);
        return;
      }
      setThinking(false);
      showConfirm(null);
      setBusy(false);
      const h = await fetch('/api/history').then(r => r.json()).catch(() => null);
      if (h) renderMessages(h.messages);
      if (s.error) addMsg('error', t('error') + s.error);
    }

    // Pick up a task that is still running from before this window opened.
    fetch('/api/status').then(r => r.json()).then(s => {
      if (s && s.busy) {
        setBusy(true);
        setThinking(true);
        setTimeout(pollStatus, 700);
      }
    }).catch(() => {});

    // ----- new chat -----
    document.getElementById('newChat').addEventListener('click', async () => {
      await fetch('/api/new', { method: 'POST' }).catch(() => {});
      renderMessages([]);
      historyPanel.classList.add('hidden');
    });

    // ----- history panel -----
    const historyPanel = document.getElementById('historyPanel');

    function fmtTime(ts) {
      return new Date(ts).toLocaleString(LOCALES[currentLang], {
        month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit',
      });
    }

    async function loadSessions() {
      const h = await fetch('/api/sessions').then(r => r.json()).catch(() => null);
      historyPanel.innerHTML = '';
      if (!h || !h.sessions || !h.sessions.length) {
        historyPanel.innerHTML = '<div class="empty">' + t('noHistory') + '</div>';
        return;
      }
      h.sessions.forEach(s => {
        const row = document.createElement('div');
        row.className = 'session-row' + (s.id === h.currentId ? ' current' : '');
        const meta = document.createElement('div');
        meta.className = 'meta';
        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = s.title || t('newChat');
        const time = document.createElement('div');
        time.className = 'time';
        time.textContent = fmtTime(s.updatedAt) + ' · ' + s.messageCount + (t('msgUnit') ? ' ' + t('msgUnit') : '');
        meta.appendChild(name);
        meta.appendChild(time);
        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = '✕';
        del.title = t('delSession');
        del.addEventListener('click', async (e) => {
          e.stopPropagation();
          const r = await fetch('/api/delete', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ id: s.id }),
          }).then(r => r.json()).catch(() => null);
          if (r && s.id === h.currentId) renderMessages(r.messages);
          loadSessions();
        });
        row.appendChild(meta);
        row.appendChild(del);
        row.addEventListener('click', async () => {
          const r = await fetch('/api/switch', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ id: s.id }),
          }).then(r => r.json()).catch(() => null);
          if (r) renderMessages(r.messages);
          historyPanel.classList.add('hidden');
        });
        historyPanel.appendChild(row);
      });
    }

    document.getElementById('showHistory').addEventListener('click', (e) => {
      e.stopPropagation();
      settingsPanel.classList.add('hidden');
      historyPanel.classList.toggle('hidden');
      if (!historyPanel.classList.contains('hidden')) loadSessions();
    });
    document.addEventListener('click', (e) => {
      if (!historyPanel.contains(e.target)) historyPanel.classList.add('hidden');
      if (!settingsPanel.contains(e.target)) settingsPanel.classList.add('hidden');
    });

    // ----- input-area toolbar: model / effort / attach / YOLO -----
    // Effort levels match each provider's own naming (Claude Code / Codex CLI /
    // Gemini thinking); the empty option means "provider default".
    const EFFORT_LEVELS = {
      claude: ['low', 'medium', 'high', 'xhigh', 'max'],
      codex:  ['minimal', 'low', 'medium', 'high', 'xhigh'],
      gemini: ['low', 'medium', 'high', 'max'],
    };
    const effortSel = document.getElementById('effortSel');
    function renderEfforts() {
      const levels = EFFORT_LEVELS[currentProvider];
      const saved = localStorage.getItem('ai.effort') || '';
      effortSel.innerHTML = '';
      const dflt = document.createElement('option');
      dflt.value = '';
      dflt.textContent = t('effortDefault');
      effortSel.appendChild(dflt);
      for (const lv of levels) {
        const opt = document.createElement('option');
        opt.value = lv;
        opt.textContent = lv;
        effortSel.appendChild(opt);
      }
      // A level saved under another provider may not exist here → fall back to default.
      effortSel.value = levels.includes(saved) ? saved : '';
    }
    renderEfforts();
    effortSel.addEventListener('change', () => localStorage.setItem('ai.effort', effortSel.value));

    const yoloToggle = document.getElementById('yoloToggle');
    const yoloLabel = document.getElementById('yoloLabel');
    yoloToggle.checked = localStorage.getItem('ai.yolo') !== '0'; // default on (previous behavior)
    yoloLabel.classList.toggle('on', yoloToggle.checked);
    yoloToggle.addEventListener('change', () => {
      localStorage.setItem('ai.yolo', yoloToggle.checked ? '1' : '0');
      yoloLabel.classList.toggle('on', yoloToggle.checked);
    });

    // Model label doubles as a shortcut to the AI settings view (click again to close).
    document.getElementById('modelBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      historyPanel.classList.add('hidden');
      const opening = settingsPanel.classList.contains('hidden');
      settingsPanel.classList.toggle('hidden');
      if (opening) {
        renderLangs();
        renderProviders();
        showView('viewAI');
      }
    });

    // ----- attachments -----
    const chips = document.getElementById('chips');
    const fileInput = document.getElementById('fileInput');
    const pendingAttachments = []; // {name, mime, text?|data?, kind?: 'midi'|'als'}
    const MAX_FILE = 2 * 1024 * 1024;      // images / text
    const MAX_BIN = 5 * 1024 * 1024;       // .mid / .als (parsed server-side)
    const TEXT_EXT = /\.(txt|md|markdown|json|jsonc|csv|tsv|xml|log|js|ts|py|sh|html|css|yml|yaml|ini)$/i;
    const binKind = (name) => /\.midi?$/i.test(name) ? 'midi' : (/\.als$/i.test(name) ? 'als' : null);
    const attIcon = (a) => a.kind === 'midi' ? '🎹' : a.kind === 'als' ? '🎚' : (a.data ? '🖼' : '📄');

    function renderChips() {
      chips.innerHTML = '';
      pendingAttachments.forEach((a, i) => {
        const chip = document.createElement('span');
        chip.className = 'chip';
        const nm = document.createElement('span');
        nm.className = 'nm';
        nm.textContent = attIcon(a) + ' ' + a.name;
        const x = document.createElement('button');
        x.className = 'x';
        x.textContent = '✕';
        x.addEventListener('click', () => {
          pendingAttachments.splice(i, 1);
          renderChips();
        });
        chip.append(nm, x);
        chips.appendChild(chip);
      });
    }

    document.getElementById('attachBtn').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
      addFiles(fileInput.files);
      fileInput.value = '';
    });

    // Live's embedded webview can't pop a native file dialog, so drag & drop
    // and paste are the primary ways to attach there (the button still works
    // in regular browsers and AIbletonBar).
    function addFiles(files) {
      for (const f of files) {
        if (pendingAttachments.length >= 10) break;
        const kind = binKind(f.name);
        const max = kind ? MAX_BIN : MAX_FILE;
        if (f.size > max) { addMsg('error', `${t('fileTooBig')}${f.name}（>${Math.round(max / 1048576)}MB）`); continue; }
        if (kind) {
          // .mid / .als — uploaded as base64; the extension server parses
          // them into a text summary before anything reaches the model.
          const rd = new FileReader();
          rd.onload = () => {
            pendingAttachments.push({ name: f.name, mime: f.type || 'application/octet-stream', kind, data: String(rd.result).split(',')[1] });
            renderChips();
          };
          rd.readAsDataURL(f);
        } else if (/^image\/(png|jpe?g|webp|gif)$/.test(f.type)) {
          const rd = new FileReader();
          rd.onload = () => {
            pendingAttachments.push({ name: f.name, mime: f.type, data: String(rd.result).split(',')[1] });
            renderChips();
          };
          rd.readAsDataURL(f);
        } else if (f.type.startsWith('text/') || TEXT_EXT.test(f.name)) {
          const rd = new FileReader();
          rd.onload = () => {
            pendingAttachments.push({ name: f.name, mime: f.type || 'text/plain', text: String(rd.result).slice(0, 20000) });
            renderChips();
          };
          rd.readAsText(f);
        } else {
          addMsg('error', t('fileUnsupported') + f.name);
        }
      }
    }

    // Drag files anywhere onto the window.
    let dragDepth = 0;
    window.addEventListener('dragenter', (e) => {
      if (![...(e.dataTransfer?.types ?? [])].includes('Files')) return;
      e.preventDefault();
      if (++dragDepth === 1) document.body.classList.add('dragging');
    });
    window.addEventListener('dragover', (e) => {
      if ([...(e.dataTransfer?.types ?? [])].includes('Files')) e.preventDefault();
    });
    window.addEventListener('dragleave', () => {
      if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); }
    });
    window.addEventListener('drop', (e) => {
      if (!e.dataTransfer?.files?.length) return;
      e.preventDefault();
      dragDepth = 0;
      document.body.classList.remove('dragging');
      addFiles(e.dataTransfer.files);
    });

    // Paste images/files straight from the clipboard (⌘V).
    document.addEventListener('paste', (e) => {
      const files = e.clipboardData?.files;
      if (!files?.length) return; // plain-text paste into the input stays untouched
      e.preventDefault();
      addFiles(files);
    });

    // ----- permission ask bar (YOLO off) -----
    const confirmBar = document.getElementById('confirmBar');
    const confirmWhat = document.getElementById('confirmWhat');
    function showConfirm(pending) {
      if (!pending) { confirmBar.classList.add('hidden'); return; }
      const args = JSON.stringify(pending.input);
      confirmWhat.textContent = t('confirmAsk') + ': ' + pending.tool + ' ' + (args.length > 120 ? args.slice(0, 120) + '…' : args);
      confirmWhat.title = args;
      confirmBar.classList.remove('hidden');
    }
    function answerConfirm(allow) {
      confirmBar.classList.add('hidden');
      fetch('/api/confirm', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ allow }),
      }).catch(() => {});
    }
    document.getElementById('confirmAllow').addEventListener('click', () => answerConfirm(true));
    document.getElementById('confirmDeny').addEventListener('click', () => answerConfirm(false));

    async function send() {
      const text = input.value.trim();
      if (!text && !pendingAttachments.length) return;
      const attachments = pendingAttachments.splice(0);
      renderChips();
      input.value = '';
      fitInput();
      if (welcome.parentNode) welcome.remove();
      addMsg('user', attachments.length
        ? text + attachments.map(a => `\n[${attIcon(a)} ${a.name}]`).join('')
        : text);

      setBusy(true);
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            text: text || '(附件)',
            provider: currentProvider,
            language: currentLang,
            apiKey: cfgInputs.apiKey.value || undefined,
            baseUrl: cfgInputs.baseUrl.value || undefined,
            model: cfgInputs.model.value || undefined,
            effort: effortSel.value || undefined,
            yolo: yoloToggle.checked,
            attachments: attachments.length ? attachments : undefined,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '请求失败');
        // Task accepted (202) — it runs server-side even if this window closes.
        setThinking(true);
        setTimeout(pollStatus, 700);
      } catch (err) {
        addMsg('error', t('error') + err.message);
        setBusy(false);
      } finally {
        input.focus();
      }
    }

    sendBtn.addEventListener('click', () => {
      if (sendBtn.classList.contains('stop')) {
        // Busy → the button means "stop". pollStatus flips it back to the
        // arrow once the task has actually wound down server-side.
        fetch('/api/stop', { method: 'POST' }).catch(() => {});
      } else {
        send();
      }
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });

    // 输入框随内容自动增高（VSCode 式），上限由 CSS max-height 控制
    function fitInput() {
      const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 8;
      input.style.height = 'auto';
      const h = input.scrollHeight + 2; // +2 上下边框
      input.style.height = Math.min(h, 134) + 'px';
      input.style.overflowY = h > 134 ? 'auto' : 'hidden';
      // 日志区被输入框压缩后保持贴底，最新消息不被遮挡；用户上翻读历史时不拉动
      if (atBottom) log.scrollTop = log.scrollHeight;
    }
    input.addEventListener('input', fitInput);

    // Initial render: settings lists, then localized strings + provider config state.
    renderLangs();
    renderProviders();
    applyLang();
    input.focus();
  </script>
</body>

</html>
